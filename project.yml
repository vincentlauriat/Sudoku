name: Sudoku
options:
  bundleIdPrefix: fr.lauriat
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
targets:
  Sudoku:
    type: application
    platform: macOS
    sources:
      - Sources
      - path: Resources
        buildPhase: resources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleName: Sudoku
        CFBundleDisplayName: Sudoku
        CFBundleIconFile: AppIcon
        LSApplicationCategoryType: public.app-category.puzzle-games
        NSHumanReadableCopyright: "© Vincent Lauriat"
        NSMainStoryboardFile: ""
        LSMinimumSystemVersion: "14.0"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.lauriat.Sudoku
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.9"
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
  SudokuTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
    dependencies:
      - target: Sudoku
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.lauriat.SudokuTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"
schemes:
  Sudoku:
    build:
      targets:
        Sudoku: all
        SudokuTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SudokuTests
